services:
  redis:
    image: redis:7-alpine
    container_name: chai-aur-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    container_name: chai-aur-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=chai_aur_redis


volumes:
  redis-data:
  mongo-data: